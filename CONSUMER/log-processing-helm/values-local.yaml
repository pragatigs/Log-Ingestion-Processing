kafka:
  name: log-processing-cluster
  version: "4.3.0"
  replicas: 1
  bootstrapServers: log-processing-cluster-kafka-bootstrap.log-processing.svc:9092

  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: false

  config:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInSyncReplicas: 1

  topic:
    name: log-processing
    partitions: 4
    replicas: 1

worker:
  replicaCount: 1
  scaledJob:
    enabled: true
  image:
    repository: log-processor
    tag: local
    pullPolicy: IfNotPresent
  kafka:
    bootstrapServers: log-processing-cluster-kafka-bootstrap.log-processing.svc:9092
    groupId: log-processing-group
    topic: log-processing
    maxPollRecords: "3"
  redis:
    redisHost: redis-master.log-processing.svc.cluster.local
  resources:
    requests:
      cpu: 10m
      memory: 2Mi
    limits:
      cpu: 50m
      memory: 128Mi

aggregator:
  replicaCount: 1
  image:
    repository: aggregator-cron
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 2Mi
    limits:
      cpu: 50m
      memory: 128Mi
  schedule: "5 0 * * *"
  s3:
    bucket: "processed-logs"
    endpoint: "http://log-processing-floci.log-processing.svc.cluster.local:4566"
    accessKey: "test"
    secretKey: "test"
    region: "us-east-1"

service:
  port: 7000